<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Glassmorphism Card Style */
        .maindiv {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 300px;
            text-align: center;
        }

        h2 {
            color: #4a4a4a;
            margin-bottom: 1.5rem;
        }

        /* Label and Input Styling */
        label {
            display: block;
            text-align: left;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
            margin-left: 5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #eee;
            border-radius: 8px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #764ba2;
        }

        /* Button Styling */
        button {
            width: 100%;
            padding: 12px;
            background-color: #764ba2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #5a3782;
        }

        button:active {
            transform: scale(0.98);
        }

        /* Result Text Area */
        #addition {
            margin-top: 20px;
            font-size: 1.5rem;
            min-height: 1.5rem;
        }
    </style>
</head>
<body>
    <div class = "maindiv">
        <h2>Quick Adder</h2>
        
        <label>Value A</label>
        <input type="text" id="num1" placeholder="e.g. 10">

        <label>Value B</label>  
        <input type="text" id="num2" placeholder="e.g. 25">

        <button onclick="add()">ADD NUMBERS</button>
        
        <p id="addition"></p>

    </div>
    <script>
        function add(){
            var a = Number(document.getElementById("num1").value);
            var b = Number(document.getElementById("num2").value);
            var result = a + b;
            document.getElementById("addition").innerHTML = "<b>"+result+"</b>"
            document.getElementById("addition").innerHTML = "<font color='blue'>"+result+"</font>"
        }
    </script>
</body>
</html>
